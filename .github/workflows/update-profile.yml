name: Update Profile

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Generate Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Agions
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: output/snake.svg

      - name: Push snake animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/snake.svg
          git diff --staged --quiet || git commit -m "docs: auto-update snake animation [skip ci]"
          git push

  verify-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Validate section markers & projects
        run: |
          SECTIONS="banner about projects activity contact footer"
          MISSING=0
          for section in $SECTIONS; do
            if grep -q "<!-- section:${section} -->" README.md; then
              echo "✅ section:${section} found"
            else
              echo "❌ section:${section} MISSING"
              MISSING=$((MISSING+1))
            fi
          done

          PROJECTS="vynaro novella Distill"
          for proj in $PROJECTS; do
            if grep -q "$proj" README.md; then
              echo "✅ $proj referenced in README"
            else
              echo "❌ $proj NOT found in README"
              MISSING=$((MISSING+1))
            fi
          done

          exit $MISSING

      - name: Validate assets & SVG header
        run: |
          for f in assets/*.svg; do
            if head -1 "$f" | grep -q '<svg'; then
              echo "✅ $f — valid SVG"
            else
              echo "❌ $f — invalid SVG header"
              exit 1
            fi
          done

      - name: Verify project URLs
        run: |
          PROJECTS="vynaro novella Distill Agions"
          for proj in $PROJECTS; do
            url="https://github.com/Agions/${proj}"
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "$url" 2>/dev/null)
            if [ "$status" = "200" ] || [ "$status" = "301" ]; then
              echo "✅ $url -> $status"
            else
              echo "❌ $url -> $status"
              exit 1
            fi
          done
