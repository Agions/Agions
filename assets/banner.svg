<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" role="img" aria-label="Agions — Full-Stack Developer &amp; Audio-Video AI Architect">
  <title>Agions Profile Banner</title>
  <desc>Professional developer profile banner for GitHub featuring Dramaxis, Kineo, and VidGlyph AI video toolchains</desc>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="50%" stop-color="#0d131f"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#64D2FF"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;0%;100%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5C842"/>
      <stop offset="100%" stop-color="#FF9F0A"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="accentTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#0A84FF"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BF5AF2"/>
      <stop offset="100%" stop-color="#7C3AED"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="glowCard" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#182236" stroke-width="0.4"/>
    </pattern>

    <!-- Ambient Glow Orbs -->
    <radialGradient id="orb-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0.22">
        <animate attributeName="stop-opacity" values="0.22;0.14;0.22" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb-teal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.18">
        <animate attributeName="stop-opacity" values="0.18;0.10;0.18" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00F5D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb-amber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5C842" stop-opacity="0.16">
        <animate attributeName="stop-opacity" values="0.16;0.08;0.16" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#F5C842" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base Layer -->
  <rect width="900" height="200" rx="14" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="899" height="199" rx="13.5" fill="none" stroke="#212b3d" stroke-width="0.8"/>

  <!-- Grid Overlay -->
  <rect x="0" y="0" width="900" height="200" rx="14" fill="url(#grid)" opacity="0.45"/>

  <!-- Ambient Light Orbs -->
  <ellipse cx="120" cy="100" rx="220" ry="140" fill="url(#orb-blue)"/>
  <ellipse cx="680" cy="90" rx="200" ry="120" fill="url(#orb-teal)"/>
  <ellipse cx="480" cy="170" rx="160" ry="60" fill="url(#orb-amber)"/>

  <!-- Dynamic Particle Field -->
  <g opacity="0.45">
    <circle cx="50" cy="30" r="1.5" fill="#0A84FF">
      <animate attributeName="cy" values="30;12;30" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="210" cy="40" r="1" fill="#00F5D4">
      <animate attributeName="cy" values="40;18;40" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.05;0.3" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="390" cy="22" r="1.2" fill="#BF5AF2">
      <animate attributeName="cy" values="22;10;22" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="610" cy="35" r="1" fill="#F5C842">
      <animate attributeName="cy" values="35;15;35" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.05;0.3" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="25" r="1.5" fill="#00F5D4">
      <animate attributeName="cy" values="25;8;25" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="860" cy="50" r="1" fill="#0A84FF">
      <animate attributeName="cy" values="50;24;50" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.05;0.3" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="168" r="1.2" fill="#F5C842">
      <animate attributeName="cy" values="168;182;168" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.05;0.2" dur="5.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Top Accent Beam -->
  <rect x="40" y="0" width="220" height="2.5" rx="1.25" fill="url(#accentBlue)" opacity="0">
    <animate attributeName="opacity" values="0;0.85" dur="1.2s" begin="0.2s" fill="freeze"/>
  </rect>

  <!-- Left Accent Vertical Beam -->
  <rect x="35" y="26" width="1.5" height="144" rx="0.75" fill="url(#accentBlue)" opacity="0.4"/>

  <!-- ================= LEFT IDENTITY ================= -->
  <!-- Avatar Area -->
  <g>
    <circle cx="68" cy="98" r="34" fill="#0A84FF" opacity="0.08">
      <animate attributeName="r" values="34;38;34" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.08;0.03;0.08" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="68" cy="98" r="28" fill="#0A84FF" opacity="0.14"/>
    <circle cx="68" cy="98" r="26" fill="none" stroke="#0A84FF" stroke-width="1.2" opacity="0.6">
      <animate attributeName="opacity" values="0.4;0.85;0.4" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="r" values="26;27;26" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="68" cy="98" r="28" fill="none" stroke="#64D2FF" stroke-width="0.5" opacity="0.35"/>
    <text x="68" y="105"
          font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',sans-serif"
          font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"
          letter-spacing="-0.5">AG</text>
  </g>

  <!-- Name & Cursor -->
  <text x="114" y="82"
        font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',sans-serif"
        font-size="38" font-weight="800" fill="#FFFFFF" letter-spacing="-0.8"
        filter="url(#glow)">Agions</text>

  <rect x="250" y="58" width="2.5" height="26" rx="1" fill="#0A84FF" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" dur="1.1s" begin="0.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Role Tag Pill -->
  <rect x="114" y="96" width="186" height="20" rx="5" fill="#0A84FF" opacity="0.15"/>
  <rect x="114" y="96" width="186" height="20" rx="5" fill="none" stroke="#0A84FF" stroke-width="0.8" opacity="0.3"/>
  <text x="122" y="110"
        font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',sans-serif"
        font-size="9" font-weight="700" letter-spacing="2" fill="#58A6FF">DESKTOP &amp; VIDEO AI ARCHITECT</text>

  <!-- Location & Bio -->
  <text x="114" y="132"
        font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',sans-serif"
        font-size="11.5" fill="#8B949E">
    <tspan fill="#38BDF8">📍 Hangzhou</tspan>
    <tspan dx="8" fill="#30363D">|</tspan>
    <tspan dx="8" fill="#00F5D4">Tauri 2.0</tspan>
    <tspan dx="4" fill="#30363D">·</tspan>
    <tspan dx="4" fill="#E8A838">Rust</tspan>
    <tspan dx="4" fill="#30363D">·</tspan>
    <tspan dx="4" fill="#BF5AF2">Multi-Agent</tspan>
  </text>

  <text x="114" y="152"
        font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',sans-serif"
        font-size="10.5" fill="#6B7280" letter-spacing="0.2">
    Next-Gen Open-Source Film &amp; Anime Creation Toolchains
  </text>

  <!-- Center Divider -->
  <rect x="432" y="24" width="1" height="148" rx="0.5" fill="#1C2433"/>

  <!-- ================= RIGHT FLAGSHIP SHOWCASE ================= -->
  <!-- Card 1: Dramaxis (Gold / Amber) -->
  <g transform="translate(450, 26)">
    <rect width="418" height="42" rx="8" fill="#101522" stroke="#252f44" stroke-width="0.9"/>
    <!-- Glow border highlight -->
    <rect x="0" y="0" width="3" height="42" rx="1.5" fill="#F5C842"/>
    <rect x="14" y="11" width="20" height="20" rx="5" fill="#F5C842" opacity="0.16"/>
    <text x="24" y="25" text-anchor="middle" font-size="12">🎬</text>
    <text x="44" y="23" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',sans-serif" font-size="13" font-weight="700" fill="#F5C842">Dramaxis</text>
    <text x="110" y="23" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',sans-serif" font-size="11" fill="#8B949E">剧枢 · 电影级解说创作平台</text>
    <text x="44" y="35" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',sans-serif" font-size="9" fill="#5A6578">6 大智能体编导群 · 5 轨毫秒级剪辑 · 剪映互通</text>
    <!-- Badge -->
    <rect x="330" y="12" width="76" height="18" rx="4" fill="#1C2433" stroke="#F5C842" stroke-width="0.6"/>
    <circle cx="340" cy="21" r="2.5" fill="#F5C842">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="350" y="24" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',sans-serif" font-size="8.5" font-weight="600" fill="#F5C842">#1 Flagship</text>
  </g>

  <!-- Card 2: Kineo (Cyan / Teal) -->
  <g transform="translate(450, 77)">
    <rect width="418" height="42" rx="8" fill="#101522" stroke="#252f44" stroke-width="0.9"/>
    <!-- Glow border highlight -->
    <rect x="0" y="0" width="3" height="42" rx="1.5" fill="#00F5D4"/>
    <rect x="14" y="11" width="20" height="20" rx="5" fill="#00F5D4" opacity="0.16"/>
    <text x="24" y="25" text-anchor="middle" font-size="12">🎨</text>
    <text x="44" y="23" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',sans-serif" font-size="13" font-weight="700" fill="#00F5D4">Kineo</text>
    <text x="88" y="23" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',sans-serif" font-size="11" fill="#8B949E">Kineo AI · 端到端多智能体漫剧</text>
    <text x="44" y="35" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',sans-serif" font-size="9" fill="#5A6578">小说一键生成 4K 漫剧 · Hub-and-Spoke 智能体集群</text>
    <!-- Badge -->
    <rect x="330" y="12" width="76" height="18" rx="4" fill="#1C2433" stroke="#00F5D4" stroke-width="0.6"/>
    <circle cx="340" cy="21" r="2.5" fill="#00F5D4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="350" y="24" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',sans-serif" font-size="8.5" font-weight="600" fill="#00F5D4">AI Anime</text>
  </g>

  <!-- Card 3: VidGlyph (Purple / Violet) -->
  <g transform="translate(450, 128)">
    <rect width="418" height="42" rx="8" fill="#101522" stroke="#252f44" stroke-width="0.9"/>
    <!-- Glow border highlight -->
    <rect x="0" y="0" width="3" height="42" rx="1.5" fill="#A855F7"/>
    <rect x="14" y="11" width="20" height="20" rx="5" fill="#A855F7" opacity="0.16"/>
    <text x="24" y="25" text-anchor="middle" font-size="12">🔍</text>
    <text x="44" y="23" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',sans-serif" font-size="13" font-weight="700" fill="#C084FC">VidGlyph</text>
    <text x="108" y="23" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',sans-serif" font-size="11" fill="#8B949E">字映 · 视频硬字幕光学精编</text>
    <text x="44" y="35" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',sans-serif" font-size="9" fill="#5A6578">本地优先 · 高性能硬字幕提取 · 多语言 OCR · 多轨工坊</text>
    <!-- Badge -->
    <rect x="330" y="12" width="76" height="18" rx="4" fill="#1C2433" stroke="#A855F7" stroke-width="0.6"/>
    <circle cx="340" cy="21" r="2.5" fill="#C084FC">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="350" y="24" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',sans-serif" font-size="8.5" font-weight="600" fill="#C084FC">OCR Studio</text>
  </g>

  <!-- ================= BOTTOM TECH TICKER ================= -->
  <rect x="35" y="180" width="830" height="0.8" rx="0.4" fill="#1C2433"/>
  <text x="40" y="193" font-family="'SF Mono','JetBrains Mono','Consolas',monospace"
        font-size="9.5" font-weight="500" fill="#3B465C" letter-spacing="0.6">
    <tspan fill="#0A84FF">⚡ STACK</tspan>
    <tspan dx="10" fill="#FFC131">Tauri 2.0</tspan>
    <tspan dx="8" fill="#252F44">·</tspan>
    <tspan dx="8" fill="#DEA584">Rust</tspan>
    <tspan dx="8" fill="#252F44">·</tspan>
    <tspan dx="8" fill="#61DAFB">React 19</tspan>
    <tspan dx="8" fill="#252F44">·</tspan>
    <tspan dx="8" fill="#42B883">Vue 3.5</tspan>
    <tspan dx="8" fill="#252F44">·</tspan>
    <tspan dx="8" fill="#3178C6">TypeScript</tspan>
    <tspan dx="8" fill="#252F44">·</tspan>
    <tspan dx="8" fill="#8B5CF6">Multi-Agent</tspan>
    <tspan dx="8" fill="#252F44">·</tspan>
    <tspan dx="8" fill="#00F5D4">FFmpeg</tspan>
    <tspan dx="8" fill="#252F44">·</tspan>
    <tspan dx="8" fill="#F5C842">Whisper</tspan>
    <tspan dx="8" fill="#252F44">·</tspan>
    <tspan dx="8" fill="#F05138">PaddleOCR</tspan>
    <tspan dx="8" fill="#252F44">·</tspan>
    <tspan dx="8" fill="#38BDF8">Docker</tspan>
    <animateTransform attributeName="transform" type="translate"
      values="0,0;-380,0;0,0" dur="25s" begin="2s" repeatCount="indefinite"/>
  </text>

  <!-- Corner Brackets -->
  <path d="M0,16 L0,0 L16,0" fill="none" stroke="url(#accentBlue)" stroke-width="1.5" opacity="0.6"/>
  <path d="M884,0 L900,0 L900,16" fill="none" stroke="url(#accentBlue)" stroke-width="1.5" opacity="0.6"/>
  <path d="M0,184 L0,200 L16,200" fill="none" stroke="url(#accentTeal)" stroke-width="1.5" opacity="0.6"/>
  <path d="M884,200 L900,200 L900,184" fill="none" stroke="url(#accentTeal)" stroke-width="1.5" opacity="0.6"/>
</svg>
